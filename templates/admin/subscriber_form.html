{{if .Error}}<div class="admin-alert admin-alert-danger">{{.Error}}</div>{{end}}

<div class="sms-admin">
  <div class="sms-admin-toolbar">
    <div class="admin-page-actions">
      <a class="btn-admin-outline" href="{{.CancelURL}}" data-turbo-frame="_top"><i class="bi bi-arrow-left"></i> Back</a>
    </div>
  </div>

  <div class="admin-data-card">
    <div class="admin-data-card-header">
      <div class="admin-data-card-summary-main">
        <h2 class="admin-data-card-title">{{.Title}}</h2>
        <p class="admin-data-card-desc">List: {{.List.Name}}</p>
      </div>
    </div>
    <form method="post" action="{{.ActionURL}}" class="admin-form" style="padding:1.25rem 1.5rem 1.5rem">
      {{.CSRFField}}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="admin-form-label">Phone</label>
          <input class="admin-form-control" name="phone" value="{{.Phone}}" placeholder="+15551234567" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn-admin-primary">Add</button>
        </div>
      </div>
    </form>
  </div>
</div>

<style>
  .admin-extension-app .sms-admin { display: flex; flex-direction: column; gap: 1.5rem; }
  .admin-extension-app .sms-admin-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 1rem;
  }
</style>
