{{if .Error}}<div class="admin-alert admin-alert-danger">{{.Error}}</div>{{end}}

<div class="sms-admin">
  <div class="sms-admin-toolbar">
    <div class="admin-page-actions">
      <a class="btn-admin-outline" href="{{.CancelURL}}" data-turbo-frame="_top"><i class="bi bi-arrow-left"></i> Back</a>
    </div>
  </div>

  <div class="admin-data-card">
    <div class="admin-data-card-header">
      <div class="admin-data-card-summary-main">
        <h2 class="admin-data-card-title">{{.Title}}</h2>
        <p class="admin-data-card-desc">Keyword must be unique. Subscribers text it to join.</p>
      </div>
    </div>
    <form method="post" action="{{.ActionURL}}" class="admin-form" style="padding:1.25rem 1.5rem 1.5rem">
      {{.CSRFField}}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="admin-form-label">Name</label>
          <input class="admin-form-control" name="name" value="{{.Row.Name}}" required>
        </div>
        <div class="col-md-6">
          <label class="admin-form-label">Keyword (label)</label>
          <input class="admin-form-control" name="label" value="{{.Row.Label}}" required>
        </div>
        <div class="col-12">
          <label class="admin-form-label">Description</label>
          <textarea class="admin-form-control" name="description" rows="2">{{.Row.Description}}</textarea>
        </div>
        <div class="col-md-6">
          <label class="admin-form-label">From number</label>
          <select class="admin-form-control" name="number_id">
            <option value="0">— Default from settings —</option>
            {{range .Numbers}}
            <option value="{{.NumberID}}" {{if eq $.Row.NumberID .NumberID}}selected{{end}}>{{.Label}} ({{.Number}})</option>
            {{end}}
          </select>
        </div>
        <div class="col-12">
          <label class="admin-form-label">Subscribe message</label>
          <textarea class="admin-form-control" name="subscribe_msg" rows="3">{{.Row.SubscribeMsg}}</textarea>
        </div>
        <div class="col-12">
          <label class="admin-form-label">Remove message</label>
          <textarea class="admin-form-control" name="remove_msg" rows="3">{{.Row.RemoveMsg}}</textarea>
        </div>
        <div class="col-12">
          <button type="submit" class="btn-admin-primary">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<style>
  .admin-extension-app .sms-admin { display: flex; flex-direction: column; gap: 1.5rem; }
  .admin-extension-app .sms-admin-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 1rem;
  }
</style>
